name: GroupChat
version: "${version}"
main: net.thermedwolf.groupchat.paper.GroupChatPlugin
api-version: "26.3"
author: ThermedWolf
description: Group chat with an offline mailbox.
permissions:
  groupchat.use:
    description: Use all GroupChat commands
    default: true
  groupchat.admin:
    description: Admin bypass (reserved for future use)
    default: op
commands:
  group:
    description: Manage chat groups
    usage: "/group <create|delete|invite|accept|decline|leave|kick|list|members|history|toggle> [args]  OR  /group <group> <history|toggle> [count]"
  gmsg:
    description: Send a message to a group (group can be omitted if you have exactly 1 group)
    usage: "/gmsg [group] <message> | /gmsg toggle [group] | /gmsg history [group] [1-5] | /gmsg <group> <toggle|history> [1-5]"
    aliases: [gm]
  gmoffline:
    description: Send a group message that's guaranteed to be in everyone's mailbox, online or not (group can be omitted if you have exactly 1 group)
    usage: "/gmoffline [group] <message> | /gmoffline toggle [group] | /gmoffline history [group] [1-5] | /gmoffline <group> <toggle|history> [1-5]"
  dm:
    description: Send a private message to a player (queues if they're offline)
    usage: "/dm <player> <message>"
  unread:
    description: View and clear your unread messages
    usage: "/unread [page|clear]"
  groupgui:
    description: Open the GroupChat menu
    usage: "/groupgui"
